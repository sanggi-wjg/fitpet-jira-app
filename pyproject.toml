[project]
name = "fitpet-jira-app"
version = "0.1.0"
description = ""
authors = [{ name = "Raynor", email = "jonggu.woo@fitpet.co.kr" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jira>=3.10.5,<4",
    "colorful-print==1.1.0",
    "tenacity>=9.1.4,<10",
    "pydantic>=2.13.5,<3",
    "typer>=0.27.3,<0.28",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2",
    "pytest>=9.0.2,<10",
    "pytest-mock>=3.15.1,<4",
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# 기본값(E4/E7/E9/F) + I(import 정렬) — PyCharm의 ruff import optimizer와 CI 검사를 일치시킨다
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
